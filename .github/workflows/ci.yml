name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The allowlist guard. It runs before the tests on purpose: a leak is the
      # one failure that cannot be fixed after the fact by a follow-up commit.
      - run: npm run lint:leaks
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run package
      # The same check AMO runs. A package it would reject must not reach a
      # release just because the tests were green.
      - run: npx --yes web-ext@10 lint --source-dir=dist --warnings-as-errors=false
